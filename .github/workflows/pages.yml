# Publica no GitHub Pages a demonstração estática das telas (demo/build_demo.py):
# os templates e o static/ reais, com o backend substituído por respostas
# simuladas no navegador (demo/mock-api.js). Não roda Flask, Ollama nem Chroma.
#
# Pré-requisito (uma vez): Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Demo no GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Só o Flask: o build renderiza os templates, não importa o resto do projeto.
      - run: pip install flask
      - run: python demo/build_demo.py --out _site --repo-url "https://github.com/${{ github.repository }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
